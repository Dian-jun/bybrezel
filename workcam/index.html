<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WorkCam</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  :root {
    --bg: #000;
    --surface: #1c1c1e;
    --surface2: #2c2c2e;
    --surface3: #3a3a3c;
    --text: #fff;
    --text2: rgba(255,255,255,0.6);
    --text3: rgba(255,255,255,0.35);
    --accent: #FFD60A;
    --blue: #0A84FF;
    --red: #FF453A;
    --green: #30D158;
    --sep: rgba(255,255,255,0.12);
    --radius: 14px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  body { background:#000; color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif; overflow:hidden; height:100vh; width:100vw; }
  
  /* SCREENS */
  .screen { position:absolute; inset:0; display:none; flex-direction:column; background:#000; }
  .screen.active { display:flex; }
  
  /* ── CAMERA SCREEN ── */
  #cameraScreen { background:#000; }
  #videoContainer { position:relative; flex:1; overflow:hidden; }
  #video { width:100%; height:100%; object-fit:cover; display:block; }
  #canvas { display:none; }
  
  /* Viewfinder overlay */
  .vf-overlay { position:absolute; inset:0; pointer-events:none; }
  
  /* Ratio crop mask — darkened areas outside the chosen ratio */
  .ratio-mask-top, .ratio-mask-bottom, .ratio-mask-left, .ratio-mask-right {
    position:absolute; background:rgba(0,0,0,0.55); pointer-events:none; z-index:4; transition:all .25s ease;
  }
  /* Crop frame border */
  .ratio-frame {
    position:absolute; border:1px solid rgba(255,255,255,0.5); pointer-events:none; z-index:5; transition:all .25s ease; box-sizing:border-box;
  }
  
  /* Horizon level */
  .horizon-line { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:120px; height:1px; background:rgba(255,255,0,0.6); display:none; }
  .horizon-dot { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:6px; height:6px; border-radius:50%; background:rgba(255,255,0,0.8); display:none; }
  
  /* Top bar */
  .cam-topbar { position:absolute; top:0; left:0; right:0; z-index:10; padding:16px 20px 12px; display:flex; align-items:center; gap:16px; background:linear-gradient(to bottom,rgba(0,0,0,0.5),transparent); }
  .cam-topbar-right { margin-left:auto; display:flex; gap:16px; align-items:center; }
  .icon-btn { background:none; border:none; color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:50%; }
  .icon-btn.active { color:var(--accent); }
  .icon-btn svg { width:22px; height:22px; }
  
  /* Aspect ratio badge */
  .ratio-badge { background:rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.3); border-radius:6px; padding:3px 8px; font-size:12px; font-weight:600; color:#fff; cursor:pointer; }
  
  /* Zoom selector */
  .zoom-bar { position:absolute; bottom:130px; left:50%; transform:translateX(-50%); display:flex; gap:4px; background:rgba(0,0,0,0.45); backdrop-filter:blur(10px); border-radius:22px; padding:4px; z-index:10; }
  .zoom-btn { background:none; border:none; color:rgba(255,255,255,0.7); font-size:13px; font-weight:600; cursor:pointer; padding:6px 14px; border-radius:18px; transition:all .15s; }
  .zoom-btn.active { background:var(--surface3); color:#fff; }
  
  /* Bottom control bar */
  .cam-bottom { position:absolute; bottom:0; left:0; right:0; z-index:10; padding:16px 24px calc(16px + var(--safe-bottom)); background:linear-gradient(to top,rgba(0,0,0,0.6),transparent); display:flex; align-items:center; justify-content:space-between; }
  .shutter { width:72px; height:72px; border-radius:50%; border:4px solid #fff; background:none; cursor:pointer; position:relative; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:transform .1s; }
  .shutter:active { transform:scale(0.92); }
  .shutter-inner { width:56px; height:56px; border-radius:50%; background:#fff; transition:transform .1s, border-radius .1s; }
  .shutter:active .shutter-inner { transform:scale(0.88); }
  
  .thumb-preview { width:52px; height:52px; border-radius:10px; overflow:hidden; background:var(--surface2); border:2px solid rgba(255,255,255,0.3); cursor:pointer; flex-shrink:0; }
  .thumb-preview img { width:100%; height:100%; object-fit:cover; }
  .thumb-count { position:absolute; bottom:-4px; right:-4px; background:var(--blue); color:#fff; font-size:10px; font-weight:700; border-radius:10px; min-width:18px; height:18px; display:flex; align-items:center; justify-content:center; padding:0 4px; }
  
  .flip-btn { width:52px; height:52px; border-radius:50%; background:rgba(255,255,255,0.15); backdrop-filter:blur(10px); border:none; color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:transform .3s; }
  .flip-btn:active { transform:rotate(180deg) scale(0.9); }
  
  /* Flash options popup */
  .flash-popup { position:absolute; top:60px; left:16px; background:rgba(30,30,32,0.92); backdrop-filter:blur(20px); border-radius:12px; border:0.5px solid var(--sep); z-index:100; display:none; }
  .flash-popup.show { display:block; }
  .flash-opt { display:flex; align-items:center; gap:10px; padding:13px 18px; font-size:14px; cursor:pointer; border-bottom:0.5px solid var(--sep); }
  .flash-opt:last-child { border-bottom:none; }
  .flash-opt:active, .flash-opt.active { color:var(--accent); }
  
  /* Ratio popup */
  .ratio-popup { position:absolute; top:60px; left:50%; transform:translateX(-50%); background:rgba(30,30,32,0.92); backdrop-filter:blur(20px); border-radius:12px; border:0.5px solid var(--sep); z-index:100; display:none; min-width:160px; }
  .ratio-popup.show { display:block; }
  .ratio-opt { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 18px; font-size:14px; cursor:pointer; border-bottom:0.5px solid var(--sep); }
  .ratio-opt:last-child { border-bottom:none; }
  .ratio-opt.active { color:var(--accent); }
  
  /* ── GALLERY SCREEN ── */
  #galleryScreen { background:var(--bg); }
  .gallery-nav { padding:16px 20px calc(8px); display:flex; align-items:center; background:rgba(0,0,0,0.95); backdrop-filter:blur(20px); border-bottom:0.5px solid var(--sep); position:sticky; top:0; z-index:10; }
  .gallery-nav h1 { font-size:17px; font-weight:600; flex:1; text-align:center; }
  .gallery-nav-btn { background:none; border:none; color:var(--blue); font-size:15px; cursor:pointer; padding:4px 0; min-width:60px; }
  .gallery-nav-btn.right { text-align:right; }
  
  .folder-tabs { display:flex; gap:8px; padding:12px 16px; overflow-x:auto; scrollbar-width:none; }
  .folder-tabs::-webkit-scrollbar { display:none; }
  .folder-tab { background:var(--surface2); border:none; color:var(--text2); font-size:13px; font-weight:500; padding:6px 14px; border-radius:20px; cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .folder-tab.active { background:var(--blue); color:#fff; }
  .folder-tab-count { background:rgba(255,255,255,0.2); border-radius:10px; padding:1px 6px; font-size:11px; }
  
  .gallery-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:2px; padding:0; overflow-y:auto; flex:1; }
  .gallery-item { aspect-ratio:1; overflow:hidden; position:relative; cursor:pointer; background:var(--surface2); }
  .gallery-item img { width:100%; height:100%; object-fit:cover; display:block; }
  .gallery-item-overlay { position:absolute; bottom:0; left:0; right:0; padding:4px; background:linear-gradient(transparent,rgba(0,0,0,0.5)); display:none; }
  .gallery-item:hover .gallery-item-overlay { display:block; }
  .gallery-empty { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:40px; color:var(--text3); }
  .gallery-empty svg { opacity:0.3; }
  
  /* ── FULLSCREEN PHOTO ── */
  #photoScreen { background:#000; z-index:50; }
  .photo-fullscreen { flex:1; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .photo-fullscreen img { max-width:100%; max-height:100%; object-fit:contain; display:block; }
  
  .photo-topbar { display:flex; align-items:center; padding:16px 20px; background:rgba(0,0,0,0.7); backdrop-filter:blur(10px); gap:12px; }
  .photo-topbar-btn { background:none; border:none; color:var(--blue); font-size:15px; cursor:pointer; display:flex; align-items:center; gap:4px; }
  .photo-title { flex:1; text-align:center; font-size:15px; font-weight:600; color:var(--text2); }
  
  .photo-menu { position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.85); z-index:20; display:flex; flex-direction:column; }
  .photo-menu-top { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; }
  .photo-menu-actions { margin-top:auto; padding:16px; display:flex; flex-direction:column; gap:1px; }
  .menu-group { background:var(--surface); border-radius:var(--radius); overflow:hidden; margin-bottom:12px; }
  .menu-row { display:flex; align-items:center; padding:14px 18px; border-bottom:0.5px solid var(--sep); cursor:pointer; gap:14px; transition:background .1s; }
  .menu-row:last-child { border-bottom:none; }
  .menu-row:active { background:var(--surface2); }
  .menu-row-icon { width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .menu-row svg { width:18px; height:18px; }
  .menu-row-label { font-size:16px; flex:1; }
  .menu-row-value { font-size:13px; color:var(--text2); }
  .menu-row.danger { color:var(--red); }
  .menu-row.danger .menu-row-icon { background:rgba(255,69,58,0.15); color:var(--red); }
  
  /* Memo overlay */
  .memo-panel { position:absolute; bottom:0; left:0; right:0; background:var(--surface); border-radius:20px 20px 0 0; padding:20px; z-index:30; transform:translateY(100%); transition:transform .3s cubic-bezier(.32,.72,0,1); }
  .memo-panel.show { transform:translateY(0); }
  .memo-panel h3 { font-size:17px; font-weight:600; text-align:center; margin-bottom:16px; }
  .memo-textarea { width:100%; background:var(--surface2); border:0.5px solid var(--sep); border-radius:12px; color:#fff; font-size:15px; padding:14px; resize:none; height:120px; font-family:inherit; outline:none; }
  .memo-save-btn { width:100%; background:var(--blue); border:none; color:#fff; border-radius:12px; padding:14px; font-size:16px; font-weight:600; cursor:pointer; margin-top:12px; }
  
  /* Markup overlay */
  .markup-panel { position:absolute; inset:0; z-index:40; display:flex; flex-direction:column; background:#000; }
  .markup-canvas-wrap { flex:1; position:relative; }
  .markup-canvas { position:absolute; inset:0; cursor:crosshair; touch-action:none; }
  .markup-tools { display:flex; align-items:center; gap:8px; padding:12px 16px; background:rgba(0,0,0,0.8); }
  .markup-tool-btn { width:36px; height:36px; border-radius:50%; border:2px solid transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; background:var(--surface2); color:#fff; }
  .markup-tool-btn.active { border-color:#fff; }
  .color-dot { width:24px; height:24px; border-radius:50%; cursor:pointer; border:2px solid transparent; }
  .color-dot.active { border-color:#fff; }
  .markup-size { flex:1; }
  
  /* Info panel */
  .info-panel { position:absolute; bottom:0; left:0; right:0; background:var(--surface); border-radius:20px 20px 0 0; padding:20px; z-index:30; transform:translateY(100%); transition:transform .3s cubic-bezier(.32,.72,0,1); }
  .info-panel.show { transform:translateY(0); }
  .info-panel h3 { font-size:17px; font-weight:600; text-align:center; margin-bottom:16px; }
  .info-row { display:flex; justify-content:space-between; padding:11px 0; border-bottom:0.5px solid var(--sep); }
  .info-row:last-child { border-bottom:none; }
  .info-key { font-size:14px; color:var(--text2); }
  .info-val { font-size:14px; font-weight:500; max-width:55%; text-align:right; word-break:break-all; }
  
  /* Share sheet */
  .share-sheet { position:fixed; inset:0; z-index:200; display:flex; flex-direction:column; justify-content:flex-end; background:rgba(0,0,0,0.5); }
  .share-sheet.hidden { display:none; }
  .share-sheet-inner { background:var(--surface); border-radius:20px 20px 0 0; padding:16px 16px calc(16px + var(--safe-bottom)); }
  .share-sheet-title { font-size:13px; color:var(--text3); text-align:center; margin-bottom:16px; }
  .share-icons { display:flex; gap:12px; justify-content:center; margin-bottom:20px; flex-wrap:wrap; }
  .share-icon-item { display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; }
  .share-icon-circle { width:54px; height:54px; border-radius:14px; display:flex; align-items:center; justify-content:center; }
  .share-icon-label { font-size:11px; color:var(--text2); }
  .share-actions { display:flex; flex-direction:column; gap:1px; }
  .share-cancel { background:var(--surface2); border:none; color:var(--blue); font-size:17px; font-weight:600; padding:16px; border-radius:var(--radius); cursor:pointer; text-align:center; margin-top:8px; width:100%; }
  
  /* Toast */
  .toast { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(0); background:rgba(0,0,0,0.75); color:#fff; padding:14px 22px; border-radius:12px; font-size:15px; z-index:300; transition:all .2s; pointer-events:none; text-align:center; backdrop-filter:blur(20px); }
  .toast.show { transform:translate(-50%,-50%) scale(1); }
  
  /* Focus ring animation */
  .focus-ring { position:absolute; border:2px solid var(--accent); border-radius:4px; width:60px; height:60px; pointer-events:none; z-index:5; transition:all .15s; opacity:0; }
  .focus-ring.show { opacity:1; }
  
  /* Manual mode panel */
  .manual-panel { position:absolute; bottom:0; left:0; right:0; z-index:10; padding:14px 20px calc(8px); background:linear-gradient(to top,rgba(0,0,0,0.75) 80%,transparent); display:none; }
  .manual-panel.show { display:block; }
  .manual-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .manual-label { font-size:11px; font-weight:600; color:rgba(255,255,255,0.55); letter-spacing:0.06em; min-width:32px; text-align:right; text-transform:uppercase; }
  .manual-val { font-size:12px; font-weight:600; color:var(--accent); min-width:48px; text-align:left; }
  .manual-slider { flex:1; -webkit-appearance:none; appearance:none; height:3px; border-radius:2px; background:rgba(255,255,255,0.2); outline:none; cursor:pointer; }
  .manual-slider::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:#fff; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,0.5); }
  .manual-unsupported { font-size:12px; color:rgba(255,255,255,0.35); font-style:italic; min-width:60px; text-align:right; }

  /* Camera permission */
  .cam-placeholder { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:#1a1a1a; }
  .cam-placeholder p { color:var(--text2); text-align:center; padding:0 40px; font-size:15px; }
  .cam-permission-btn { background:var(--blue); color:#fff; border:none; border-radius:12px; padding:14px 28px; font-size:16px; font-weight:600; cursor:pointer; }
  
  /* Mode tabs */
  .mode-tabs { display:flex; justify-content:center; gap:20px; padding:8px 20px; background:transparent; }
  .mode-tab { background:none; border:none; color:var(--text3); font-size:12px; font-weight:600; letter-spacing:0.05em; cursor:pointer; padding:4px 0; text-transform:uppercase; }
  .mode-tab.active { color:var(--accent); }
  
  /* Photo bottom bar */
  .photo-bottombar { display:flex; justify-content:space-around; align-items:center; padding:16px 24px calc(16px + var(--safe-bottom)); background:rgba(0,0,0,0.7); backdrop-filter:blur(10px); }
  .photo-bottom-btn { display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; background:none; border:none; color:var(--blue); font-size:12px; }
  .photo-bottom-btn svg { width:26px; height:26px; }
  .photo-bottom-btn.danger { color:var(--red); }
  
  /* Folder create */
  .folder-create-btn { background:none; border:1px dashed var(--sep); border-radius:20px; color:var(--text3); font-size:13px; padding:6px 14px; cursor:pointer; white-space:nowrap; flex-shrink:0; display:flex; align-items:center; gap:4px; }
  
  /* Loading spinner */
  @keyframes spin { to { transform:rotate(360deg); } }
  .spinner { width:20px; height:20px; border:2px solid rgba(255,255,255,0.2); border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; }
  
  /* Swipe hint for photo navigation */
  .swipe-hint { position:absolute; top:50%; left:0; right:0; display:flex; justify-content:space-between; pointer-events:none; z-index:5; padding:0 8px; transform:translateY(-50%); }
  .swipe-arrow { color:rgba(255,255,255,0.4); display:flex; align-items:center; }
</style>
</head>
<body>

<!-- ═══════════════════════════════ CAMERA SCREEN ═══════════════════════════════ -->
<div id="cameraScreen" class="screen active">
  <div id="videoContainer">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    
    <!-- Ratio crop mask -->
    <div class="ratio-mask-top" id="maskTop"></div>
    <div class="ratio-mask-bottom" id="maskBottom"></div>
    <div class="ratio-mask-left" id="maskLeft"></div>
    <div class="ratio-mask-right" id="maskRight"></div>
    <div class="ratio-frame" id="ratioFrame"></div>
    
    <!-- Horizon level -->
    <div class="horizon-line" id="horizonLine"></div>
    <div class="horizon-dot" id="horizonDot"></div>
    
    <!-- Focus ring -->
    <div class="focus-ring" id="focusRing"></div>
    
    <!-- Top bar -->
    <div class="cam-topbar">
      <button class="icon-btn" id="flashBtn" title="플래시">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13,2 3,14 12,14 11,22 21,10 12,10"/></svg>
      </button>
      <button class="icon-btn" id="horizonBtn" title="수평">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="8" x2="8" y2="8"/><line x1="3" y1="16" x2="8" y2="16"/><line x1="16" y1="8" x2="21" y2="8"/><line x1="16" y1="16" x2="21" y2="16"/></svg>
      </button>
      <div class="cam-topbar-right">
        <div class="ratio-badge" id="ratioBadge">4:3</div>
        <button class="icon-btn" id="settingsBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93l-1.41 1.41M4.93 4.93l1.41 1.41M4.93 19.07l1.41-1.41M19.07 19.07l-1.41-1.41M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>
        </button>
      </div>
    </div>
    
    <!-- Flash popup -->
    <div class="flash-popup" id="flashPopup">
      <div class="flash-opt active" data-flash="off">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13,2 3,14 12,14 11,22 21,10 12,10"/><line x1="2" y1="2" x2="22" y2="22" stroke-width="1.5"/></svg>끄기
      </div>
      <div class="flash-opt" data-flash="on">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13,2 3,14 12,14 11,22 21,10 12,10"/></svg>켜기
      </div>
      <div class="flash-opt" data-flash="auto">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13,2 3,14 12,14 11,22 21,10 12,10"/><text x="14" y="10" font-size="5" fill="currentColor" stroke="none">A</text></svg>자동
      </div>
      <div class="flash-opt" data-flash="torch">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2l4 6H6l4-6zm0 6v14"/></svg>손전등
      </div>
    </div>
    
    <!-- Ratio popup -->
    <div class="ratio-popup" id="ratioPopup">
      <div class="ratio-opt active" data-ratio="4:3">4:3 <span>✓</span></div>
      <div class="ratio-opt" data-ratio="16:9">16:9</div>
      <div class="ratio-opt" data-ratio="1:1">1:1</div>
    </div>
    
    <!-- Mode tabs -->
    <div class="mode-tabs" style="position:absolute;bottom:170px;left:0;right:0;z-index:10;">
      <button class="mode-tab active" data-mode="photo">사진</button>
      <button class="mode-tab" data-mode="manual">수동</button>
    </div>
    
    <!-- Manual mode panel -->
    <div class="manual-panel" id="manualPanel">
      <div class="manual-row">
        <span class="manual-label">ISO</span>
        <input class="manual-slider" type="range" id="isoSlider" min="50" max="3200" step="50" value="100">
        <span class="manual-val" id="isoVal">100</span>
        <span class="manual-unsupported" id="isoUnsupported" style="display:none;">미지원</span>
      </div>
      <div class="manual-row">
        <span class="manual-label">SS</span>
        <input class="manual-slider" type="range" id="ssSlider" min="0" max="9" step="1" value="5">
        <span class="manual-val" id="ssVal">1/60</span>
        <span class="manual-unsupported" id="ssUnsupported" style="display:none;">미지원</span>
      </div>
      <div class="manual-row">
        <span class="manual-label">EV</span>
        <input class="manual-slider" type="range" id="evSlider" min="-3" max="3" step="0.5" value="0">

<script>
// ════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════
let photos = [];
let folders = ['전체','미분류'];

// ── IndexedDB setup ──
let db;
const DB_NAME = 'workcam_db', DB_VER = 1;

function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'key' });
    };
    req.onsuccess = e => { db = e.target.result; res(db); };
    req.onerror = () => rej(req.error);
  });
}

function dbPut(store, value) {
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(value).onsuccess = () => res();
    tx.onerror = () => rej(tx.error);
  });
}

function dbGetAll(store) {
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}

function dbDelete(store, key) {
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(key).onsuccess = () => res();
    tx.onerror = () => rej(tx.error);
  });
}

async function loadDB() {
  await openDB();
  const stored = await dbGetAll('photos');
  photos = stored.sort((a, b) => b.id.localeCompare(a.id));
  const metaFolders = await dbGetAll('meta');
  const f = metaFolders.find(m => m.key === 'folders');
  if (f) folders = f.value;
}
let stream = null;
let facingMode = 'environment';
let currentZoom = 1;
let currentRatio = '4:3';
let flashMode = 'off';
let horizonActive = false;
let currentPhotoIdx = 0;
let currentFolder = 'all';
let markupTool = 'pen';
let markupColor = '#FF453A';
let markupHistory = [];
let drawing = false;
let lastX, lastY, startX, startY;

// ════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════
async function init() {
  await loadDB();
  await startCamera();
  renderFolderTabs();
  renderGallery();
  updateThumbCount();
  if (photos.length > 0) {
    const thumbImg = document.getElementById('thumbImg');
    thumbImg.src = photos[0].markup || photos[0].data;
    thumbImg.style.display = 'block';
  }
  setupTouchFocus();
  setupDeviceOrientation();
  setupSwipeNav();
  
  // Init ratio mask after layout settles
  setTimeout(updateRatioMask, 100);
  window.addEventListener('resize', updateRatioMask);
  
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#flashPopup') && !e.target.closest('#flashBtn')) {
      document.getElementById('flashPopup').classList.remove('show');
    }
    if (!e.target.closest('#ratioPopup') && !e.target.closest('#ratioBadge')) {
      document.getElementById('ratioPopup').classList.remove('show');
    }
  });
}

// ════════════════════════════════════════════════════════════
// CAMERA
// ════════════════════════════════════════════════════════════
async function startCamera() {
  const constraints = {
    video: {
      facingMode,
      width: { ideal: 3840 },
      height: { ideal: 2160 }
    }
  };
  try {
    if (stream) { stream.getTracks().forEach(t => t.stop()); }
    stream = await navigator.mediaDevices.getUserMedia(constraints);
    const video = document.getElementById('video');
    video.srcObject = stream;
    video.style.display = 'block';
    document.getElementById('camPlaceholder').style.display = 'none';
    applyRatio();
  } catch(e) {
    document.getElementById('camPlaceholder').style.display = 'flex';
    document.getElementById('video').style.display = 'none';
  }
}

document.getElementById('requestPermBtn').onclick = startCamera;

document.getElementById('flipBtn').onclick = async function() {
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  this.style.transform = 'rotate(180deg)';
  setTimeout(() => { this.style.transform = ''; }, 300);
  await startCamera();
};

// Zoom
document.querySelectorAll('.zoom-btn').forEach(btn => {
  btn.onclick = function() {
    document.querySelectorAll('.zoom-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    const z = parseFloat(this.dataset.zoom);
    currentZoom = z;
    applyZoom(z);
  };
});

function applyZoom(z) {
  if (!stream) return;
  const track = stream.getVideoTracks()[0];
  if (!track) return;
  const caps = track.getCapabilities?.();
  if (caps && caps.zoom) {
    track.applyConstraints({ advanced: [{ zoom: Math.min(z, caps.zoom.max) }] });
  } else {
    // CSS transform fallback
    const scale = z >= 1 ? z : 1;
    document.getElementById('video').style.transform = `scale(${scale})`;
  }
}

// Ratio
document.getElementById('ratioBadge').onclick = function(e) {
  e.stopPropagation();
  document.getElementById('ratioPopup').classList.toggle('show');
};

document.querySelectorAll('.ratio-opt').forEach(opt => {
  opt.onclick = function() {
    currentRatio = this.dataset.ratio;
    document.querySelectorAll('.ratio-opt').forEach(o => { o.classList.remove('active'); o.querySelector('span') && (o.querySelector('span').textContent = ''); });
    this.classList.add('active');
    this.innerHTML += ' <span>✓</span>';
    document.getElementById('ratioBadge').textContent = currentRatio;
    document.getElementById('ratioPopup').classList.remove('show');
    applyRatio();
  };
});

function applyRatio() {
  // Show the full video at natural size, overlay dark masks for cropped areas
  const vc = document.getElementById('videoContainer');
  const video = document.getElementById('video');
  
  // Reset — full fill
  vc.style.aspectRatio = '';
  vc.style.maxHeight = '';
  video.style.aspectRatio = '';
  video.style.width = '100%';
  video.style.height = '100%';
  video.style.objectFit = 'cover';
  
  updateRatioMask();
}

function updateRatioMask() {
  const vc = document.getElementById('videoContainer');
  const vcW = vc.clientWidth;
  const vcH = vc.clientHeight;
  if (!vcW || !vcH) { requestAnimationFrame(updateRatioMask); return; }

  const [rw, rh] = currentRatio.split(':').map(Number);
  const targetRatio = rw / rh;
  const containerRatio = vcW / vcH;

  let frameLeft = 0, frameTop = 0, frameWidth = vcW, frameHeight = vcH;

  if (containerRatio > targetRatio) {
    // Container wider than target — mask left & right
    frameWidth = Math.round(vcH * targetRatio);
    frameLeft = Math.round((vcW - frameWidth) / 2);
    frameTop = 0;
    frameHeight = vcH;
  } else if (containerRatio < targetRatio) {
    // Container taller than target — mask top & bottom
    frameHeight = Math.round(vcW / targetRatio);
    frameTop = Math.round((vcH - frameHeight) / 2);
    frameLeft = 0;
    frameWidth = vcW;
  }

  const maskTop = document.getElementById('maskTop');
  const maskBottom = document.getElementById('maskBottom');
  const maskLeft = document.getElementById('maskLeft');
  const maskRight = document.getElementById('maskRight');
  const frame = document.getElementById('ratioFrame');

  // Top mask
  maskTop.style.cssText = `top:0;left:0;right:0;height:${frameTop}px;`;
  // Bottom mask
  maskBottom.style.cssText = `bottom:0;left:0;right:0;height:${frameTop}px;`;
  // Left mask
  maskLeft.style.cssText = `top:${frameTop}px;left:0;width:${frameLeft}px;height:${frameHeight}px;`;
  // Right mask
  maskRight.style.cssText = `top:${frameTop}px;right:0;width:${frameLeft}px;height:${frameHeight}px;`;
  // Frame border
  frame.style.cssText = `left:${frameLeft}px;top:${frameTop}px;width:${frameWidth}px;height:${frameHeight}px;`;

  // Hide masks if no cropping needed (1:1 on square container etc.)
  const noMask = frameLeft === 0 && frameTop === 0;
  [maskTop,maskBottom,maskLeft,maskRight,frame].forEach(el => el.style.display = noMask ? 'none' : 'block');
}

function applyFlash() {
  if (!stream) return;
  const track = stream.getVideoTracks()[0];
  if (!track) return;
  try {
    if (flashMode === 'torch') {
      track.applyConstraints({ advanced: [{ torch: true }] });
    } else {
      track.applyConstraints({ advanced: [{ torch: false }] });
    }
  } catch(e) {}
}

    if (!horizonActive) return;
    const gamma = e.gamma || 0;
    const line = document.getElementById('horizonLine');
    const dot = document.getElementById('horizonDot');
    line.style.transform = `translate(-50%, -50%) rotate(${-gamma}deg)`;
    const isLevel = Math.abs(gamma) < 2;
    line.style.background = isLevel ? 'rgba(48,209,88,0.8)' : 'rgba(255,255,0,0.6)';
    dot.style.background = isLevel ? 'rgba(48,209,88,0.8)' : 'rgba(255,255,0,0.8)';
  });
}

// Touch focus
function setupTouchFocus() {
  const vc = document.getElementById('videoContainer');
  vc.addEventListener('click', (e) => {
    if (e.target.closest('.cam-topbar,.cam-bottom,.zoom-bar,.mode-tabs,.flash-popup,.ratio-popup,.manual-panel')) return;
    const ring = document.getElementById('focusRing');
    const rect = vc.getBoundingClientRect();
    const x = e.clientX - rect.left - 30;
    const y = e.clientY - rect.top - 30;
    ring.style.left = x + 'px';
    ring.style.top = y + 'px';
    ring.classList.add('show');
    setTimeout(() => ring.classList.remove('show'), 1200);
    
    if (!stream) return;
    const track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities?.();
    if (caps && caps.focusMode) {
      const fx = (e.clientX - rect.left) / rect.width;
      const fy = (e.clientY - rect.top) / rect.height;
      track.applyConstraints({ advanced: [{ pointOfInterest: { x: fx, y: fy }, focusMode: 'single-shot' }] }).catch(() => {});
    }
  });
}

// Mode tabs + manual panel
const SS_VALUES = ['1/1000','1/500','1/250','1/125','1/60','1/30','1/15','1/8','1/4','1/2'];
let currentMode = 'photo';

document.querySelectorAll('.mode-tab').forEach(tab => {
  tab.onclick = function() {
    document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
    this.classList.add('active');

    if (currentMode === 'manual') {
      panel.classList.add('show');
      checkManualCapabilities();
    } else {
      panel.classList.remove('show');
      resetToAuto();
    }
  };
});

function checkManualCapabilities() {
  if (!stream) return;
  const track = stream.getVideoTracks()[0];
  const caps = track.getCapabilities?.() || {};
  
  // ISO
  if (caps.iso) {
    document.getElementById('isoSlider').min = caps.iso.min;
    document.getElementById('isoSlider').max = caps.iso.max;
    document.getElementById('isoSlider').value = caps.iso.min * 2 || 100;
    document.getElementById('isoUnsupported').style.display = 'none';
    document.getElementById('isoSlider').style.display = '';
    document.getElementById('isoVal').style.display = '';
  } else {
    document.getElementById('isoUnsupported').style.display = '';
    document.getElementById('isoSlider').style.display = 'none';
    document.getElementById('isoVal').style.display = 'none';
  }
  
  // Exposure (EV)
  if (caps.exposureCompensation) {
    document.getElementById('evSlider').min = caps.exposureCompensation.min;
    document.getElementById('evSlider').max = caps.exposureCompensation.max;
    document.getElementById('evSlider').step = caps.exposureCompensation.step || 0.5;
    document.getElementById('evUnsupported').style.display = 'none';
    document.getElementById('evSlider').style.display = '';
    document.getElementById('evVal').style.display = '';
  } else {
    document.getElementById('evUnsupported').style.display = '';
    document.getElementById('evSlider').style.display = 'none';
    document.getElementById('evVal').style.display = 'none';
  }
  
  // Shutter speed (exposureTime)
  if (caps.exposureTime) {
    document.getElementById('ssUnsupported').style.display = 'none';
    document.getElementById('ssSlider').style.display = '';
    document.getElementById('ssVal').style.display = '';
  } else {
    document.getElementById('ssUnsupported').style.display = '';
    document.getElementById('ssSlider').style.display = 'none';
    document.getElementById('ssVal').style.display = 'none';
  }
  
  // White balance
  if (caps.colorTemperature) {
    document.getElementById('wbSlider').min = caps.colorTemperature.min || 2500;
    document.getElementById('wbSlider').max = caps.colorTemperature.max || 7500;
    document.getElementById('wbUnsupported').style.display = 'none';
    document.getElementById('wbSlider').style.display = '';
    document.getElementById('wbVal').style.display = '';
  } else {
    document.getElementById('wbUnsupported').style.display = '';
    document.getElementById('wbSlider').style.display = 'none';
    document.getElementById('wbVal').style.display = 'none';
  }
}

function resetToAuto() {
  if (!stream) return;
  const track = stream.getVideoTracks()[0];
  try {
    track.applyConstraints({ advanced: [{
      exposureMode: 'continuous',
      whiteBalanceMode: 'continuous',
      focusMode: 'continuous'
    }]});
  } catch(e) {}
}

// ISO slider
document.getElementById('isoSlider').addEventListener('input', function() {
  const val = parseInt(this.value);
  document.getElementById('isoVal').textContent = val;
  applyManualConstraint({ iso: val });
});

// Shutter speed slider
document.getElementById('ssSlider').addEventListener('input', function() {
  const idx = parseInt(this.value);
  const label = SS_VALUES[idx];
  document.getElementById('ssVal').textContent = label;
  // Convert to seconds for API: e.g. "1/60" → 1/60
  const parts = label.split('/');
  const seconds = parts.length === 2 ? parseFloat(parts[0]) / parseFloat(parts[1]) : parseFloat(parts[0]);
  // exposureTime in microseconds for some APIs
  applyManualConstraint({ exposureTime: seconds * 1000000, exposureMode: 'manual' });
});

// EV slider
document.getElementById('evSlider').addEventListener('input', function() {
  const val = parseFloat(this.value);
  document.getElementById('evVal').textContent = val >= 0 ? `+${val}` : `${val}`;
  applyManualConstraint({ exposureCompensation: val });
});

// White balance slider
document.getElementById('wbSlider').addEventListener('input', function() {
  const val = parseInt(this.value);
  document.getElementById('wbVal').textContent = `${val}K`;
  applyManualConstraint({ whiteBalanceMode: 'manual', colorTemperature: val });
});

function applyManualConstraint(constraint) {
  if (!stream) return;
  const track = stream.getVideoTracks()[0];
  try { track.applyConstraints({ advanced: [constraint] }); } catch(e) {}
}

document.getElementById('shutterBtn').onclick = capturePhoto;

async function capturePhoto() {
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  
  let vw = video.videoWidth || 1280;
  let vh = video.videoHeight || 720;
  
  // Apply ratio crop
  let sx = 0, sy = 0, sw = vw, sh = vh;
  const [rw, rh] = currentRatio.split(':').map(Number);
  const targetRatio = rw / rh;
  const videoRatio = vw / vh;
  
  if (videoRatio > targetRatio) {
    sw = vh * targetRatio;
    sx = (vw - sw) / 2;
  } else {
    sh = vw / targetRatio;
    sy = (vh - sh) / 2;
  }
  
  canvas.width = sw;
  canvas.height = sh;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, sw, sh);
  
  // Flash effect if flash=on
  if (flashMode === 'on') {
    const flash = document.createElement('div');
    flash.style.cssText = 'position:fixed;inset:0;background:#fff;opacity:0.9;z-index:1000;transition:opacity .3s;';
    document.body.appendChild(flash);
    setTimeout(() => { flash.style.opacity = '0'; setTimeout(() => flash.remove(), 300); }, 80);
  }
  
  const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
  
  const photo = {
    id: Date.now().toString(),
    data: dataUrl,
    date: new Date().toISOString(),
    memo: '',
    folder: currentFolder === 'all' ? '미분류' : currentFolder,
    ratio: currentRatio,
    zoom: currentZoom + 'x',
    width: sw,
    height: sh,
    facing: facingMode === 'environment' ? '후면' : '전면',
    format: 'JPEG',
    markup: null,
    location: null
  };
  
  // Try geolocation
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(async (pos) => {
      photo.location = `${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`;
      await savePhoto(photo);
    }, () => {}, { timeout: 3000 });
  }
  
  photos.unshift(photo);
  await savePhoto(photo);
  
  // Update thumb
  const thumbImg = document.getElementById('thumbImg');
  thumbImg.src = dataUrl;
  thumbImg.style.display = 'block';
  updateThumbCount();
  
  // Shutter animation
  const vc = document.getElementById('videoContainer');
  vc.style.opacity = '0.3';
  setTimeout(() => { vc.style.opacity = '1'; }, 100);
  
  showToast('📸 저장됨');
  renderGallery();
}

async function savePhoto(photo) {
  try {
    await dbPut('photos', photo);
  } catch(e) {
    showToast('저장 실패: ' + (e.message || '알 수 없는 오류'));
  }
}

function renderFolderTabs() {
  const tabs = document.getElementById('folderTabs');
  const allFolders = ['all', ...folders.filter(f => f !== '전체')];
  const folderNames = { all: '전체' };
  
  tabs.innerHTML = '';
  
  allFolders.forEach(f => {
    const name = f === 'all' ? '전체' : f;
    const count = f === 'all' ? photos.length : photos.filter(p => p.folder === f).length;
    const btn = document.createElement('button');
    btn.className = 'folder-tab' + (currentFolder === f ? ' active' : '');
    btn.dataset.folder = f;
    btn.innerHTML = `${name} <span class="folder-tab-count">${count}</span>`;
    btn.onclick = function() {

      document.querySelectorAll('.folder-tab').forEach(t => t.classList.remove('active'));
      this.classList.add('active');
      renderGallery();
    };
    tabs.appendChild(btn);
  });
  
  // Add folder button
  const addBtn = document.createElement('button');
  addBtn.className = 'folder-create-btn';
  addBtn.innerHTML = '+ 폴더';
  addBtn.onclick = createFolder;
  tabs.appendChild(addBtn);
  
  // Update all count
  document.getElementById('allCount') && (document.getElementById('allCount').textContent = photos.length);
}

async function createFolder() {
  const name = prompt('새 폴더 이름:');
  if (!name || !name.trim()) return;
  if (!folders.includes(name.trim())) {
    folders.push(name.trim());
    await saveFolders();
    renderFolderTabs();
  }
}

document.getElementById('newFolderBtn').onclick = createFolder;

function renderGallery() {
  const grid = document.getElementById('galleryGrid');
  const empty = document.getElementById('galleryEmpty');
  
  let filtered = currentFolder === 'all' ? photos : photos.filter(p => p.folder === currentFolder);
  
  if (filtered.length === 0) {
    grid.style.display = 'none';
    empty.style.display = 'flex';
    return;
  }
  
  grid.style.display = 'grid';
  empty.style.display = 'none';
  grid.innerHTML = '';
  
  filtered.forEach((photo, idx) => {
    const globalIdx = photos.indexOf(photo);
    const item = document.createElement('div');
    item.className = 'gallery-item';
    item.draggable = true;
    item.dataset.id = photo.id;
    item.innerHTML = `<img src="${photo.data}" loading="lazy" alt="">`;
    if (photo.memo) {
      item.innerHTML += `<div class="gallery-item-overlay"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/></svg></div>`;
    }
    item.onclick = () => openPhoto(globalIdx);
    
    // Drag & drop for folder move
    item.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('text/plain', photo.id);
    });
    
    grid.appendChild(item);
  });
  
  // Folder tabs as drop targets
  document.querySelectorAll('.folder-tab').forEach(tab => {
    tab.addEventListener('dragover', (e) => { e.preventDefault(); tab.style.background = 'rgba(10,132,255,0.3)'; });
    tab.addEventListener('dragleave', () => { tab.style.background = ''; });
    tab.addEventListener('drop', (e) => {
      e.preventDefault();
      tab.style.background = '';
      const id = e.dataTransfer.getData('text/plain');
      const folder = tab.dataset.folder;
      if (folder === 'all') return;
      const p = photos.find(p => p.id === id);
      if (p) { p.folder = folder; savePhoto(p).then(() => { renderGallery(); renderFolderTabs(); showToast(`'${folder}'로 이동됨`); }); }
    });
  });
  
  updateThumbCount();
}

// Swipe navigation
function setupSwipeNav() {
  const fs = document.getElementById('photoFullscreen');
  let startX, startTime;
  
  fs.addEventListener('touchstart', (e) => {
    startX = e.touches[0].clientX;
    startTime = Date.now();
  }, { passive: true });
  
  fs.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].clientX - startX;
    const dt = Date.now() - startTime;
    if (dt < 300 && Math.abs(dx) > 50) {
      if (dx < 0 && currentPhotoIdx < photos.length - 1) { currentPhotoIdx++; renderPhoto(); }
      else if (dx > 0 && currentPhotoIdx > 0) { currentPhotoIdx--; renderPhoto(); }
    }
  }, { passive: true });
  
  document.getElementById('prevArrow').onclick = () => { if (currentPhotoIdx > 0) { currentPhotoIdx--; renderPhoto(); } };
  document.getElementById('nextArrow').onclick = () => { if (currentPhotoIdx < photos.length - 1) { currentPhotoIdx++; renderPhoto(); } };
}

function openMarkup() {
  closePhotoMenu();
  const photo = photos[currentPhotoIdx];
  if (!photo) return;
  
  const panel = document.getElementById('markupPanel');
  const markupImg = document.getElementById('markupImg');
  const canvas = document.getElementById('markupCanvas');
  
  markupImg.src = photo.data;
  panel.style.display = 'flex';
  
  markupImg.onload = () => {
    canvas.width = markupImg.clientWidth || markupImg.naturalWidth;
    canvas.height = markupImg.clientHeight || markupImg.naturalHeight;
    
    // Load existing markup
    if (photo.markup) {
      const img = new Image();
      img.onload = () => { canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height); };
      img.src = photo.markup;
    }
  };
  
  setupMarkupDrawing(canvas);
}

function setupMarkupDrawing(canvas) {
  const ctx = canvas.getContext('2d');
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  
  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return { x: (src.clientX - rect.left) * (canvas.width / rect.width), y: (src.clientY - rect.top) * (canvas.height / rect.height) };
  }
  
  function startDraw(e) {
    drawing = true;
    const { x, y } = getPos(e);
    lastX = startX = x; lastY = startY = y;
    markupHistory.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    if (markupTool === 'pen') { ctx.beginPath(); ctx.moveTo(x, y); }
  }
  
  function draw(e) {
    if (!drawing) return;
    e.preventDefault();
    const { x, y } = getPos(e);
    const size = parseInt(document.getElementById('brushSize').value);
    ctx.strokeStyle = markupTool === 'eraser' ? 'rgba(0,0,0,1)' : markupColor;
    ctx.lineWidth = markupTool === 'eraser' ? size * 3 : size;
    ctx.globalCompositeOperation = markupTool === 'eraser' ? 'destination-out' : 'source-over';
    
    if (markupTool === 'pen') {
      ctx.lineTo(x, y);
      ctx.stroke();
    }
    lastX = x; lastY = y;
  }
  
  function endDraw(e) {
    if (!drawing) return;
    drawing = false;
    const { x, y } = getPos(e.changedTouches ? e : { clientX: lastX, clientY: lastY, getBoundingClientRect: () => canvas.getBoundingClientRect() });
    const size = parseInt(document.getElementById('brushSize').value);
    
    if (markupTool === 'line') {
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = markupColor;
      ctx.lineWidth = size;
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(lastX, lastY);
      ctx.stroke();
    } else if (markupTool === 'rect') {
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = markupColor;
      ctx.lineWidth = size;
      ctx.beginPath();
      ctx.strokeRect(startX, startY, lastX - startX, lastY - startY);
    }
  }
  
  canvas.onmousedown = startDraw;
  canvas.onmousemove = draw;
  canvas.onmouseup = endDraw;
  canvas.addEventListener('touchstart', startDraw, { passive: false });
  canvas.addEventListener('touchmove', draw, { passive: false });
  canvas.addEventListener('touchend', endDraw, { passive: false });
}

function setTool(tool) {
  markupTool = tool;
  document.querySelectorAll('.markup-tool-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(tool + 'Tool').classList.add('active');
}

function setColor(el) {
  markupColor = el.dataset.color;
  document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
  el.classList.add('active');
}

async function saveMarkup() {
  const canvas = document.getElementById('markupCanvas');
  const markupImg = document.getElementById('markupImg');
  
  // Composite: draw original + markup
  const out = document.createElement('canvas');
  out.width = markupImg.naturalWidth;
  out.height = markupImg.naturalHeight;
  const ctx = out.getContext('2d');
  ctx.drawImage(markupImg, 0, 0);
  ctx.drawImage(canvas, 0, 0, out.width, out.height);
  
  photos[currentPhotoIdx].markup = out.toDataURL('image/jpeg', 0.92);
  await savePhoto(photos[currentPhotoIdx]);
  document.getElementById('markupPanel').style.display = 'none';
  renderPhoto();
  showToast('마크업 저장됨');
}

function cancelMarkup() {
  document.getElementById('markupPanel').style.display = 'none';
}

// ════════════════════════════════════════════════════════════
// DELETE
// ════════════════════════════════════════════════════════════
async function deleteCurrentPhoto() {
  if (!confirm('이 사진을 삭제하시겠습니까?')) return;
  const photo = photos[currentPhotoIdx];
  photos.splice(currentPhotoIdx, 1);
  await dbDelete('photos', photo.id);
  renderGallery();
  renderFolderTabs();
  
  if (photos.length === 0) { closePhoto(); return; }
  if (currentPhotoIdx >= photos.length) currentPhotoIdx = photos.length - 1;
  renderPhoto();
  closePhotoMenu();
  showToast('삭제됨');
}

// ════════════════════════════════════════════════════════════
// SHARE
// ════════════════════════════════════════════════════════════
function openShareSheet() {
  closePhotoMenu();
  
  // Folder move buttons
  const list = document.getElementById('folderMoveList');
  list.innerHTML = '';
  folders.filter(f => f !== '전체').forEach(f => {
    const btn = document.createElement('button');
    btn.className = 'folder-tab' + (photos[currentPhotoIdx]?.folder === f ? ' active' : '');
    btn.textContent = f;
    btn.onclick = async () => {
      photos[currentPhotoIdx].folder = f;
      await savePhoto(photos[currentPhotoIdx]);
      closeShareSheet();
      renderGallery();
      renderFolderTabs();
      showToast(`'${f}'로 이동됨`);
    };
    list.appendChild(btn);
  });
  
  document.getElementById('shareSheet').classList.remove('hidden');
}

function closeShareSheet(e) {
  if (e && e.target !== document.getElementById('shareSheet')) return;
  document.getElementById('shareSheet').classList.add('hidden');
}

function shareToGDrive() {
  showToast('Google Drive 연결 필요\n설정에서 연결하세요');
  closeShareSheet();
}

function shareToOneDrive() {
  showToast('OneDrive 연결 필요\n설정에서 연결하세요');
  closeShareSheet();
}

async function shareNative() {
  const photo = photos[currentPhotoIdx];
  if (!photo) return;
  
  if (navigator.share) {
    const blob = await fetch(photo.markup || photo.data).then(r => r.blob());
    const file = new File([blob], `workcam_${photo.id}.jpg`, { type: 'image/jpeg' });
    try {
      await navigator.share({ files: [file], title: 'WorkCam 사진' });
    } catch(e) {}
  } else {
    // Fallback: download
    const a = document.createElement('a');
    a.href = photo.markup || photo.data;
    a.download = `workcam_${photo.id}.jpg`;
    a.click();
  }
  closeShareSheet();
}

async function copyImageToClipboard() {
  const photo = photos[currentPhotoIdx];
  if (!photo) return;
  try {
    const blob = await fetch(photo.markup || photo.data).then(r => r.blob());
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    showToast('클립보드에 복사됨');
  } catch(e) {
    showToast('복사 실패');
  }
  closeShareSheet();
}

// ════════════════════════════════════════════════════════════
// NAVIGATION
// ════════════════════════════════════════════════════════════
document.querySelectorAll('.cam-bottom .thumb-preview').forEach(el => {
  el.onclick = () => {
    if (photos.length > 0) openLastPhoto();
    else showGallery();
  };
});

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// Bottom tab nav — gallery icon touch
document.getElementById('thumbPreview').addEventListener('touchstart', () => {}, { passive: true });

// ════════════════════════════════════════════════════════════
// TOAST
// ════════════════════════════════════════════════════════════
let toastTimer;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
}

// START

init();
</script>
