<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630"><rect width="1200" height="630" fill="#F3F0E8"/><path d="M70 80h1060M70 550h1060" stroke="#1D1D1B"/><text x="70" y="270" font-family="sans-serif" font-size="72" fill="#1D1D1B">그날 우리는</text><circle cx="480" cy="245" r="9" fill="#CD2E3A"/><text x="70" y="340" font-family="sans-serif" font-size="28">대한민국의 모든 날, 그리고 그 안에 살았던 우리.</text><text x="70" y="520" font-family="monospace" font-size="20">THAT DAY, WE  /  1950 — PRESENT</text></svg>
