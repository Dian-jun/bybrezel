<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Brezel 초대장</title>
<style>[hidden]{display:none!important}body{font:16px -apple-system,BlinkMacSystemFont,sans-serif;color:#151515;background:white;margin:0}main{max-width:440px;margin:12vh auto;padding:28px}h1{font-size:30px;line-height:1.3}p{color:#737373;line-height:1.6}button,a{display:block;box-sizing:border-box;width:100%;padding:16px;border-radius:12px;margin:14px 0;text-align:center;font:inherit;text-decoration:none}a{color:white;background:#151515}button{border:1px solid #ddd;background:white}small{color:#777}</style>
<main><b>Brezel Money</b><h1>함께 쓰는 가계부에<br>초대받았어요.</h1><p>개인 가계부와 계좌 잔액은 공유되지 않아요. 참여 후 공동 공간에 직접 기록한 내역만 멤버에게 공개됩니다.</p><a id="open" hidden>앱에서 초대장 열기</a><button id="copy" hidden>초대 링크 복사</button><p id="status" role="status"></p><small>앱이 없다면 먼저 설치한 후 받은 초대 링크를 다시 눌러주세요. 앱 설치 주소는 출시 후 안내됩니다.</small></main>
<script>
const raw=location.hash.slice(1), match=/^invite=([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$/i.exec(raw);
const status=document.getElementById('status');
if(match){const open=document.getElementById('open'),copy=document.getElementById('copy');open.hidden=false;copy.hidden=false;open.href='brezelmoney://invite/'+match[1];copy.onclick=async()=>{try{await navigator.clipboard.writeText(location.href);status.textContent='초대 링크를 복사했어요.'}catch{status.textContent='주소창의 링크를 복사해주세요.'}}}else{status.textContent='올바른 초대 링크가 아닙니다. 보낸 사람에게 다시 요청해주세요.'}
</script></html>
